<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Mapa uczelni</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <div id="map"></div>

    <aside id="room-panel" class="overlay" hidden>
      <section id="room-info" class="card"></section>
      <section id="room-schedule" class="card"></section>
    </aside>

    <div id="search-panel" class="overlay" hidden>
      <div id="search-results"></div>
    </div>

    <div id="search-bar" class="overlay">
      <button id="search-back" type="button" aria-label="Wróć do mapy">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <input id="search-input" type="search"
             placeholder="Sala, Wykładowca, Nr dziennika"
             autocomplete="off" autocorrect="off" spellcheck="false"
             enterkeyhint="search">
      <button id="search-clear" type="button" aria-label="Wyczyść" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round"/>
        </svg>
      </button>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="search-data.js"></script>
  <script src="search.js"></script>
  <script src="room-panel.js"></script>
</body>
</html>
